<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini PetClinic</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <header th:replace="~{fragments :: header}"></header>
  <main>
    <h2 th:text="${owner.id == null} ? 'Add Owner' : 'Edit Owner'">Owner</h2>
    <form class="card" method="post" th:object="${owner}"
          th:action="${owner.id == null} ? @{/owners/new} : @{/owners/{id}/edit(id=${owner.id})}">
      <label>First name
        <input type="text" th:field="*{firstName}">
        <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
      </label>
      <label>Last name
        <input type="text" th:field="*{lastName}">
        <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
      </label>
      <label>City
        <input type="text" th:field="*{city}">
      </label>
      <label>Telephone
        <input type="text" th:field="*{telephone}" placeholder="10 digits">
        <span class="error" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></span>
      </label>
      <div>
        <button type="submit">Save</button>
        <a class="btn secondary" th:href="@{/}">Cancel</a>
      </div>
    </form>
  </main>
</body>
</html>
